<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>평양냉면 30</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
:root{
  --bg:#FFFFFF; --bg-soft:#F6F7F9; --line:#E5E7EB;
  --ink:#16181D; --muted:#767E8B;
  --trad:#D99400; --start:#1F6FD0; --side:#D6336C;
  --michelin:#BD1E2D; --selected:#3F4752; --rating:#B96B00; --heritage:#6D4C9C;
  --r-sm:8px; --r-md:12px; --r-pill:999px;
}
*{box-sizing:border-box;}
html{height:100%;}
body{
  margin:0;min-height:100%;
  background:var(--bg);color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}

.shell{display:flex;height:100vh;height:100dvh;overflow:hidden;}
.panel{
  width:380px;flex:0 0 380px;
  display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--line);background:var(--bg);
}
#map{flex:1;min-height:0;background:var(--bg-soft);}

.head{padding:24px 22px 16px;}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0;}
.michelin-summary{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;}
.summary-label{font-size:11.5px;color:var(--muted);font-weight:600;margin-right:2px;}
.m-badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:var(--r-pill);
  padding:4px 8px;font-size:10.5px;font-weight:700;line-height:1;border:1px solid transparent;}
.m-badge.bib{background:#FFF0F1;color:#A81725;border-color:#F2C7CC;}
.m-badge.selected{background:#F0F2F4;color:#343B45;border-color:#D8DDE2;}
.name-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.pop-michelin{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;}
.rating-note{width:100%;font-size:10.5px;color:var(--muted);margin-top:1px;}
.rating-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px;font-size:12px;line-height:1.3;}
.rating-star{color:var(--rating);font-size:12px;}
.rating-score{font-weight:750;color:var(--ink);}
.rating-count{color:var(--muted);}
.rating-none{color:var(--muted);font-weight:550;}
.heritage-badge{display:inline-flex;align-items:center;white-space:nowrap;border-radius:var(--r-pill);
  padding:4px 8px;font-size:10.5px;font-weight:700;line-height:1;background:#F4EFFA;color:var(--heritage);border:1px solid #DDD0EC;}
.pop-rating{margin:0 0 8px;}

.notice{
  display:none;margin:0 22px 12px;padding:10px 12px;
  background:#FFF6E5;border:1px solid #F0D9A8;border-radius:var(--r-sm);
  font-size:12px;line-height:1.5;color:#7A5A12;
}
.notice.show{display:block;}

.filters{padding:0 22px 16px;display:flex;flex-direction:column;gap:10px;}
.chips{display:flex;gap:6px;}
.chip{
  flex:1;cursor:pointer;appearance:none;
  background:var(--bg-soft);border:1px solid var(--line);color:var(--muted);
  border-radius:var(--r-pill);padding:11px 6px;
  font-family:inherit;font-size:13px;font-weight:600;line-height:1;
  transition:background .15s,color .15s,border-color .15s;
}
.chip[aria-pressed="true"]{color:#fff;border-color:transparent;}
.chip.c-trad[aria-pressed="true"]{background:var(--trad);}
.chip.c-start[aria-pressed="true"]{background:var(--start);}
.chip.c-side[aria-pressed="true"]{background:var(--side);}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

.search{
  width:100%;background:var(--bg-soft);border:1px solid var(--line);
  color:var(--ink);border-radius:var(--r-md);padding:12px 14px;
  font-family:inherit;font-size:16px;
}
.search::placeholder{color:#A2A9B5;}
.search:focus{outline:none;border-color:var(--ink);background:var(--bg);}

.regions{display:flex;gap:6px;flex-wrap:wrap;}
.regions button{
  cursor:pointer;background:var(--bg);border:1px solid var(--line);color:var(--muted);
  border-radius:var(--r-pill);padding:8px 13px;
  font-family:inherit;font-size:12px;font-weight:500;
  transition:border-color .15s,color .15s;
}
.regions button:hover,.regions button:focus-visible{color:var(--ink);border-color:var(--ink);outline:none;}

.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 32px;}
.group-title{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);padding:18px 22px 6px;}
.item{
  display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;
  padding:12px 22px;cursor:pointer;border-left:3px solid transparent;transition:background .14s;
}
.item:hover{background:var(--bg-soft);}
.item:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;}
.item.is-active{background:var(--bg-soft);}
.item.is-active.g-trad{border-left-color:var(--trad);}
.item.is-active.g-start{border-left-color:var(--start);}
.item.is-active.g-side{border-left-color:var(--side);}

.num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;margin-top:2px;}
.g-trad .num{background:var(--trad);}
.g-start .num{background:var(--start);}
.g-side .num{background:var(--side);}

.name{font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.35;}
.addr{font-size:12px;color:var(--muted);line-height:1.5;margin-top:2px;}
.rowlinks{display:flex;gap:6px;margin-top:8px;}
.rowlinks a{
  text-decoration:none;font-size:11.5px;font-weight:600;color:var(--ink);
  background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;
}

.pin{
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-family:'Pretendard Variable',Pretendard,sans-serif;
  font-size:12px;font-weight:700;color:#fff;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transition:transform .16s;
}
.pin.trad{background:var(--trad);}
.pin.start{background:var(--start);}
.pin.side{background:var(--side);}
.pin.is-active{transform:scale(1.35);box-shadow:0 2px 10px rgba(0,0,0,.35);}

.leaflet-popup-content-wrapper{background:var(--bg);color:var(--ink);
  border-radius:var(--r-md);box-shadow:0 6px 24px rgba(0,0,0,.14);}
.leaflet-popup-content{margin:16px 18px;min-width:190px;}
.leaflet-popup-close-button{color:var(--muted)!important;padding:8px 8px 0 0!important;}
.pop-tier{font-size:11px;font-weight:600;margin-bottom:5px;}
.pop-name{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;}
.pop-addr{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px;}
.pop-links{display:flex;gap:6px;}
.pop-links a{flex:1;text-align:center;text-decoration:none;font-size:12px;font-weight:600;
  padding:9px 4px;border-radius:var(--r-sm);background:var(--bg-soft);
  border:1px solid var(--line);color:var(--ink);}
.leaflet-control-attribution{font-size:10px!important;}
.thumb{width:52px;height:52px;border-radius:var(--r-sm);object-fit:cover;
  background:var(--bg-soft);border:1px solid var(--line);display:block;}
.item{grid-template-columns:28px 1fr;}
.item.has-thumb{grid-template-columns:28px 1fr 52px;}
.pop-photo{width:100%;height:132px;object-fit:cover;border-radius:var(--r-sm);
  margin-bottom:12px;background:var(--bg-soft);display:block;}
.leaflet-popup-content:has(.pop-photo){min-width:230px;}

@media (max-width:860px){
  .shell{flex-direction:column;}
  #map{order:1;flex:0 0 42dvh;}
  .panel{order:2;width:100%;flex:1 1 auto;border-right:0;border-top:1px solid var(--line);}
  .head{padding:16px 18px 10px;}
  h1{font-size:20px;}
  .michelin-summary{margin-top:7px;}
  .notice{margin:0 18px 10px;}
  .filters{padding:0 18px 12px;}
  .item,.group-title{padding-left:18px;padding-right:18px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>

<div class="shell">
  <aside class="panel">
    <header class="head">
      <h1>평양냉면 30</h1>
      <div class="michelin-summary" aria-label="2026 미쉐린 가이드 선정 현황">
        <span class="summary-label">2026 미쉐린 가이드</span>

        <span class="heritage-badge">서울 3대 평양냉면 맛집</span>
        <span class="rating-note">평점과 평가 수는 제공 시점 기준</span>
      </div>
    </header>
    <div class="notice" id="notice">지도를 불러오지 못했습니다. 목록에서 네이버지도·카카오맵으로 바로 열 수 있습니다.</div>

    <div class="filters">
      <div class="chips" role="group" aria-label="분류 필터">
        <button class="chip c-trad"  data-tier="trad"  aria-pressed="true">정통파</button>
        <button class="chip c-start" data-tier="start" aria-pressed="true">입문자</button>
        <button class="chip c-side"  data-tier="side"  aria-pressed="true">사이드파</button>
      </div>
      <input class="search" id="q" type="search" placeholder="가게 이름 · 동네로 찾기" aria-label="검색">
      <div class="regions">
        <button data-view="all">전체</button>
        <button data-view="seoul">서울·수도권</button>
        <button data-view="busan">부산</button>
        <button data-view="daegu">대구</button>
      </div>
    </div>

    <div class="list" id="list"></div>
  </aside>

  <div id="map"></div>
</div>

function ratingOf(d){return RATINGS[d.name]||null;}
function heritageBadge(d){
  var r=ratingOf(d);
  return r&&r.seoul3?'<span class="heritage-badge">서울 3대 평냉집</span>':'';
}
function ratingHtml(d,popup){
  var r=ratingOf(d);
  var cls=popup?'rating-row pop-rating':'rating-row';
  if(!r||r.score===null){
    return '<div class="'+cls+'"><span class="rating-none">후기 미제공</span></div>';
  }
  return '<div class="'+cls+'" aria-label="평점 '+r.score.toFixed(1)+'점, 평가 '+r.count+'개">'+
    '<span class="rating-star" aria-hidden="true">★</span>'+
    '<span class="rating-score">'+r.score.toFixed(1)+'/5.0</span>'+
    '<span class="rating-count">('+r.count.toLocaleString('ko-KR')+')</span></div>';
}

/* ─────────────────────────────────────────────────────────────
   사진 URL을 따옴표 안에 붙여넣으면 목록 썸네일과 팝업에 표시됩니다.
   네이버 지도 → 가게 → 사진 → 원하는 사진 우클릭(모바일은 길게 누르기)
   → '이미지 주소 복사'. 비워 두면 사진 영역은 나타나지 않습니다.
   ───────────────────────────────────────────────────────────── */
var PHOTOS={
};
function photoOf(d){return PHOTOS[d.name]||'';}

var VIEWS={seoul:[[37.55,127.00],11],busan:[[35.1486,129.1116],14],daegu:[[35.8699,128.5923],14]};

function naverUrl(d){return d.naver||'https://map.naver.com/p/search/'+encodeURIComponent(d.name+' '+d.addr);}
function kakaoUrl(d){return d.kakao||'https://map.kakao.com/?q='+encodeURIComponent(d.name+' '+d.addr);}

var listEl=document.getElementById('list');
var enabled={trad:true,start:true,side:true};
var items=[],markers=[],map=null,mapReady=false,activeIdx=null;

/* ---- 목록: 지도와 무관하게 항상 먼저 그린다 ---- */
function renderList(){
  listEl.innerHTML='';items=[];
  var q=document.getElementById('q').value.trim().toLowerCase();

  ['trad','start','side'].forEach(function(tier){
    if(!enabled[tier])return;
    var rows=[];
    DATA.forEach(function(d,i){
      if(d.t!==tier)return;
      if(q&&(d.name+d.addr).toLowerCase().indexOf(q)===-1)return;
      rows.push({d:d,i:i});
    });
    if(!rows.length)return;

    var h=document.createElement('div');
    h.className='group-title';h.textContent=TIERS[tier].label;
    listEl.appendChild(h);

    rows.forEach(function(r){
      var d=r.d,i=r.i;
      var el=document.createElement('div');
      el.className='item g-'+tier+(activeIdx===i?' is-active':'');
      el.tabIndex=0;
      var links=mapReady?'':'<div class="rowlinks">'+
        '<a href="'+naverUrl(d)+'" target="_blank" rel="noopener">네이버지도</a>'+
        '<a href="'+kakaoUrl(d)+'" target="_blank" rel="noopener">카카오맵</a></div>';
      var ph=photoOf(d);
      if(ph)el.classList.add('has-thumb');
      el.innerHTML='<div class="num">'+d.n+'</div><div>'+
        '<div class="name-line"><div class="name">'+d.name+'</div>'+michelinBadge(d)+heritageBadge(d)+'</div>'+
        ratingHtml(d,false)+
        '<div class="addr">'+d.addr+'</div>'+links+'</div>'+
        (ph?'<img class="thumb" src="'+ph+'" alt="" loading="lazy" '+
            'onerror="this.remove();this.closest&&0">':'');
      el.addEventListener('click',function(e){
        if(e.target.tagName==='A')return;
        select(i,true);
      });
      el.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i,true);}
      });
      listEl.appendChild(el);
      items.push({el:el,i:i});
    });
  });

  if(!listEl.children.length){
    var empty=document.createElement('div');
    empty.className='group-title';empty.textContent='결과 없음';
    listEl.appendChild(empty);
  }
}

function select(i,fly){
  activeIdx=i;
  items.forEach(function(x){x.el.classList.toggle('is-active',x.i===i);});
  if(!mapReady)return;
  var olds=document.querySelectorAll('.pin.is-active');
  for(var k=0;k<olds.length;k++)olds[k].classList.remove('is-active');
  var pin=document.querySelector('.pin[data-idx="'+i+'"]');
  if(pin)pin.classList.add('is-active');
  if(fly){
    map.flyTo([DATA[i].lat,DATA[i].lng],Math.max(map.getZoom(),15),{duration:.6});
    markers[i].openPopup();
  }
}

function applyFilter(){
  if(mapReady){
    DATA.forEach(function(d,i){
      var on=enabled[d.t];
      if(on&&!map.hasLayer(markers[i]))markers[i].addTo(map);
      if(!on&&map.hasLayer(markers[i]))map.removeLayer(markers[i]);
    });
  }
  renderList();
}

document.querySelectorAll('.chip').forEach(function(btn){
  btn.addEventListener('click',function(){
    var t=btn.dataset.tier;
    enabled[t]=!enabled[t];
    btn.setAttribute('aria-pressed',String(enabled[t]));
    applyFilter();
  });
});
document.getElementById('q').addEventListener('input',renderList);

renderList();

/* ---- Leaflet 로드: CDN 순서대로 재시도 ---- */
function loadScript(list,i,done){
  if(i>=list.length){done(false);return;}
  var s=document.createElement('script');
  s.src=list[i];
  s.onload=function(){done(true);};
  s.onerror=function(){loadScript(list,i+1,done);};
  document.head.appendChild(s);
}

loadScript([
  'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
  'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
  'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'
],0,function(ok){
  if(!ok||!window.L){fail();return;}
  try{initMap();}catch(e){fail();}
});

function fail(){
  document.getElementById('notice').classList.add('show');
  document.getElementById('map').style.display='none';
  mapReady=false;
  renderList();
}

function initMap(){
  map=L.map('map',{zoomControl:true}).setView([37.55,127.00],11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19
  }).addTo(map);

  DATA.forEach(function(d,i){
    var icon=L.divIcon({
      className:'',
      html:'<div class="pin '+d.t+'" data-idx="'+i+'">'+d.n+'</div>',
      iconSize:[24,24],iconAnchor:[12,12],popupAnchor:[0,-14]
    });
    var m=L.marker([d.lat,d.lng],{icon:icon}).addTo(map);
    var ph=photoOf(d);
    var mic=michelinOf(d);
    var badges=michelinBadge(d)+heritageBadge(d);
    var micInfo=badges?'<div class="pop-michelin">'+badges+'</div>':'';
    var micLink=mic?'<a href="'+mic.url+'" target="_blank" rel="noopener">미쉐린</a>':'';
    m.bindPopup(
      (ph?'<img class="pop-photo" src="'+ph+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'')+
      '<div class="pop-tier" style="color:'+TIERS[d.t].color+'">'+TIERS[d.t].label+' '+d.n+'</div>'+
      '<div class="pop-name">'+d.name+'</div>'+micInfo+ratingHtml(d,true)+
      '<div class="pop-addr">'+d.addr+'</div>'+
      '<div class="pop-links">'+
        '<a href="'+naverUrl(d)+'" target="_blank" rel="noopener">네이버지도</a>'+
        '<a href="'+kakaoUrl(d)+'" target="_blank" rel="noopener">카카오맵</a>'+micLink+
      '</div>');
    m.on('click',function(){select(i,false);});
    markers.push(m);
  });

  mapReady=true;
  renderList();

  document.querySelectorAll('.regions button').forEach(function(b){
    b.addEventListener('click',function(){
      var v=b.dataset.view;
      if(v==='all'){
        var on=markers.filter(function(m,i){return enabled[DATA[i].t];});
        if(on.length)map.fitBounds(L.featureGroup(on).getBounds().pad(0.15));
      }else{
        map.flyTo(VIEWS[v][0],VIEWS[v][1],{duration:.7});
      }
    });
  });

  setTimeout(function(){map.invalidateSize();},300);
  window.addEventListener('resize',function(){map.invalidateSize();});
  window.addEventListener('orientationchange',function(){
    setTimeout(function(){map.invalidateSize();},400);
  });
}
</script>
</body>
